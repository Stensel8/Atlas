name: CodeQL Advanced

on:
  push:
    branches: ["new-update"]
  pull_request:
    branches: ["new-update"]
  schedule:
    - cron: '28 6 * * 5'

# Default minimal permissions — each job overrides only what it needs.
permissions: read-all

# ============================================================
# Overview of checks:
#
#  analyze-actions  → CodeQL static analysis on GitHub Actions workflows
# ============================================================

jobs:

  # ----------------------------------------------------------
  # GITHUB ACTIONS ANALYSIS
  # Scans workflow YAML for logic errors, missing permissions,
  # and injection risks (security-extended pack).
  # ----------------------------------------------------------
  analyze-actions:
    name: Analyze GitHub Actions (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read

    steps:
      - name: Checkout repository
        # gh api repos/actions/checkout/commits/[VERSION] --jq '.sha'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Initialize CodeQL
        # gh api repos/github/codeql-action/commits/v4 --jq '.sha'
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          category: "/language:actions"
