---
title: Debloat Send-To Context Menu
description: Removes commonly un-used items from the Send-To context menu in Explorer
actions:
  - !powerShell:
    command: '& (Join-Path $env:windir ''AtlasDesktop\4. Interface Tweaks\Context Menus\Send To\Debloat Send To Context Menu.ps1'') -Disable ''Documents'', ''Mail Recipient'', ''Fax recipient'', ''Bluetooth'''
    exeDir: true
    wait: true
    runas: currentUserElevated