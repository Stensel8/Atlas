---
title: Disable Cloud Optimized Content on Taskbar
description: Disables cloud optimized content in the taskbar for QoL, which pins items dependent on things like having linked phone or Xbox Live - seems to break Windows Spotlight
actions:
  - !registryValue:
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    value: 'DisableCloudOptimizedContent'
    data: '1'
    type: REG_DWORD

  - !registryValue:
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    value: 'DisableWindowsConsumerFeatures'
    data: '1'
    type: REG_DWORD

    # Suppress Microsoft 365 subscription ads in Settings Home
  - !registryValue:
    path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\CloudContent'
    value: 'DisableConsumerAccountStateContent'
    data: '1'
    type: REG_DWORD

    # Disable share drag tray (sidebar appearing during drag operations)
  - !registryValue:
    path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\CDP'
    value: 'DragTrayEnabled'
    data: '0'
    type: REG_DWORD
