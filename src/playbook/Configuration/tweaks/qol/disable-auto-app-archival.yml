---
title: Disable Automatic Store App Archiving
description: Disables automatic Store app archiving so that less commonly apps don't disappear and have to be redownloaded
actions:
  - !powerShell:
    command: '& (Join-Path $env:windir ''AtlasDesktop\3. General Configuration\Store App Archiving\Disable Store App Archiving (default).ps1'') -Silent'
    exeDir: true
    wait: true
    runas: currentUserElevated